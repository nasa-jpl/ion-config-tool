name: Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: cd editor && npm install

      - name: Install Playwright browsers
        run: cd editor && npx playwright install --with-deps chromium

      - name: Start development server
        run: cd editor && npm start &

      - name: Wait for server to be ready
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:3000; do sleep 5; done'

      - name: Run Playwright tests
        run: cd editor && npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: editor/test-results

      - name: Upload playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: editor/playwright-report
