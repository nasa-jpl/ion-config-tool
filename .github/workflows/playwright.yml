name: Playwright Tests

# Reusable: called by build.yml, which owns the push/pull_request triggers
# so the suite runs once per event. workflow_dispatch allows a manual run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node version is pinned in .nvmrc (see RELEASING.md).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # npm ci installs exactly the versions in editor/package-lock.json.
      - name: Install dependencies
        working-directory: editor
        run: npm ci

      - name: Install Playwright browsers
        working-directory: editor
        run: npx playwright install --with-deps chromium

      # No separate dev server is started here: editor/tests/fixtures/global-setup.ts
      # starts the dev server (port 3000) and mock server (port 8000) itself
      # and waits for them to be ready.
      - name: Run Playwright tests
        working-directory: editor
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: editor/test-results

      - name: Upload playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: editor/playwright-report
